<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sign up page</title>
</head>
<body th:replace="~{base :: layout(~{::section})}">

	<section
		class="banner d-flex justify-content-center align-items-center">
		<div class="container text-center">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<h2 class="text-center">Register here!!!</h2>
					<div class="my-card mt-3">

						<!-- Alert Message -->
						<div th:if="${message}"
							th:classappend="'alert ' + ${message.type}"
							class="alert alert-dismissible fade show text-center"
							role="alert">
							<p th:text="${message.content}"></p>
							<button type="button" class="btn-close" data-bs-dismiss="alert"
								aria-label="Close"></button>
						</div>

						<!-- Signup Image -->
						<div class="container text-center">
							<img alt="" th:src="@{/image/signup.png}" style="width: 80px">
						</div>

						<!-- Signup Form -->
						<form novalidate="novalidate" th:action="@{/do_register}"
							method="post" th:object="${user}">

							<!-- Name Field -->
							<div class="form-group">
								<label for="name_field">Your Name</label> <input type="text"
									class="form-control" id="name_field"
									th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
									placeholder="Enter here" required="required" th:field="*{name}">
								<div class="invalid-feedback"
									th:each="e : ${#fields.errors('name')}" th:text="${e}"></div>
							</div>

							<!-- Email Field -->
							<div class="form-group">
								<label for="email_field">Email address</label> <input
									type="email" class="form-control" id="email_field"
									th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
									placeholder="Enter here" required="required"
									th:field="*{email}">
								<div class="invalid-feedback"
									th:each="e : ${#fields.errors('email')}" th:text="${e}">
								</div>
							</div>

							<!-- Password Field -->
							<div class="form-group">
								<label for="password_field">Password</label> <input
									type="password" class="form-control" id="password_field"
									placeholder="Enter here" required="required"
									th:field="*{password}">
							</div>

							<!-- About Field -->
							<div class="form-group">
								<textarea rows="10" class="form-control"
									placeholder="Enter something about yourself"></textarea>
							</div>

							<!-- Terms and Conditions -->
							<div class="form-group form-check text-center">
								<input type="checkbox" name="agreement" class="form-check-input"
									id="agreement" th:value="true" th:checked="${user?.agreement}">
								<label for="agreement" class="form-check-label"> Accept
									terms and conditions </label>
							</div>

							<!-- Submit and Reset Buttons -->
							<div class="container text-center">
								<button type="submit" class="btn btn-primary text-white">Submit</button>
								<button type="reset" class="btn btn-warning text-white">Reset</button>
							</div>

						</form>

					</div>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
