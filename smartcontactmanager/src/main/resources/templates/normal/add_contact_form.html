<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	>
	<head>
<meta charset="UTF-8">
<title>add contacts</title>
</head>
<body th:replace="normal/base :: layout(~{::section})">
<section>
	<div class="card mr-3 ml-3">
		<div class="card-body ">
			<h1 class=" text-center">Add Contact</h1>
			<div class="container-fluid mt-1">
				<div class="row">
					<div class="col-md-10 offset-md-1">
						<form th:action="@{/user/process-contact}" method="post"
							th:object="${contact}" enctype="multipart/form-data">

							<!-- First Name -->
							<div class="input-group">
								<div class="input-group-prepend">
									<div class="input-group-text mr-3">
										<i class="fa fa-plus"> </i>
									</div>
								</div>
								<input type="text" id="firstName" name="name"
									placeholder="Enter Name here" class="form-control"
									required="required" />
							</div>
							<!-- Second Name -->
							<div class="input-group mt-3">
								<div class="input-group-prepend">
									<div class="input-group-text mr-3">
										<i class="fas fa-user-alt"> </i>
									</div>
								</div>
								<input type="text" id="secondName" name="secondName"
									placeholder="Enter NickName here" class="form-control"
									required="required" />
							</div>

							<!-- Phone -->
							<div class="input-group mt-3">
								<div class="input-group-prepend">
									<div class="input-group-text mr-3">
										<i class="fa fa-phone"> </i>
									</div>
								</div>
								<input type="number" id="phone" name="phone"
									placeholder="Enter Phone here" class="form-control"
									required="required" min="10" />
							</div>

							<!-- Email field -->
							<div class="input-group mt-3">
								<div class="input-group-prepend">
									<div class="input-group-text mr-3">@</div>
								</div>
								<input type="email" id="email" name="email"
									placeholder="Enter Email here" class="form-control"
									required="required" />
							</div>

							<!-- Work field -->
							<div class="input-group mt-3">
								<div class="input-group-prepend">
									<div class="input-group-text mr-3">
										<i class="fa fa-briefcase"> </i>
									</div>
								</div>
								<input type="text" id="work" name="work"
									placeholder="Enter Work here" class="form-control"
									required="required" />
							</div>

							<!-- contact description -->
							<div class="form-group mt-3">
								<textarea rows="10" name="description" id="textarea"
									placeholder="Enter contact description" class="form-control"></textarea>
							</div>
							<!-- contact image -->
							<div class="custom-file">
								<input type="file" name="profileImage">
							</div>
							<div class="container text-center">
								<button class="btn btn-outline-primary">save contact</button>
							</div>
						</form>

					</div>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
	<script>
    ClassicEditor
        .create(document.querySelector('#textarea'))
        .catch(error => {
            console.error(error);
        });
</script>



</section>
</body>
</html>
