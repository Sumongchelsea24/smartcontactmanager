<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>show contacts</title>
</head>
<body th:replace="normal/base :: layout(~{::section})">
	<section>
		<div class="card mr-3 ml-3" th:if="${contact != null}">
			<div class="card-body ">
				<div class="container text-center">
					<img style="height: 200px; width: 200px;"
						class="my_profile_picture" src=""
						th:src="@{'/image/' + ${contact.image}}" alt="profile photo" />
					<h3 class="mt-3">
						<span th:text="${contact.name}"></span>(<span
							th:text="${contact.secondName}"></span>)
					</h3>

					<table class="table">
						<thead>
							<tr>
								<th scope="col">#ID</th>
								<th scope="col">SCMUSER<span th:text="${contact.cid}"></span></th>

							</tr>
						</thead>
						<tbody>
							<tr>
								<th scope="row">Email</th>
								<td><span th:text="${contact.email}"></span></td>
							</tr>
							<tr>
								<th scope="row">Phone</th>
								<td><span th:text="${contact.phone}"></span></td>
							</tr>
							<tr>
								<th scope="row">Work</th>
								<td><span th:text="${contact.work}"></span></td>
							</tr>

						</tbody>
					</table>
					<div class="description mt-3">
						<th:block th:utext="${contact.description}"></th:block>
					</div>
					<form th:action="@{'/user/delete/' + ${contact.cid}}" method="post">
						<button type="submit" class="btn btn-danger btn-block">Delete</button>
					</form>
					<!--<div class="container mt-3">
						<button th:onclick="|deleteContact(${contact.cid})|"
							class="btn btn-danger btn-block">Delete</button> -->
					<form method="post"
						th:action="@{'/user/update-contact/' + ${contact.cid}}">
						<button type="submit" class="btn btn-primary btn-block">Update</button>
					</form>

				</div>
			</div>
		</div>
		</div>
		<!-- Show fallback if not allowed -->
		<h1 class="text-center p-3 bg-danger text-white"
			th:if="${contact == null}">You don't have permission to see this
			contact</h1>

	</section>
	<script type="text/javascript">
		function deleteContact(cid) {
			if (confirm("Are you sure you want to delete this contact?")) {
				window.location.href = "/user/delete/" + cid;
			}
		}
	</script>

</body>
</html>
