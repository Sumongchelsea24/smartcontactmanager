<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>profile</title>
</head>
<body th:replace="normal/base :: layout(~{::section})">
	<section>
		<div class="container">
			<div class="card">
				<div class="card-body my-5">
					<h1 class="text-center" th:text="${user.name}"></h1>
					<div class="container text-center">
						<img class="my_profile_picture"
							style="height: 200px; width: 200px;"
							th:src="@{'/image/' + ${user.imageUrl}}" alt="profile photo" />

					</div>
					<table class="table text-center mt-3">
						<thead>
							<tr>
								<th scope="col">UserId</th>
								<th scope="col">SCMUSER<span th:text="${user.id}"></span></th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<th scope="row">Email</th>
								<td><span th:text="${user.email}"></span></td>
							</tr>
							<tr>
								<th scope="row">Role</th>
								<td><span th:text="${user.role}"></span></td>
							</tr>
							<tr>
								<th scope="row">Account Active</th>
								<td><span th:text="${user.enabled}"></span></td>
							</tr>
							<tr>
								<th scope="row">About</th>
								<td><span th:text="${user.about}"></span></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
